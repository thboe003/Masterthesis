version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pole-ai-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-pole_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pole_password}
      POSTGRES_DB: ${DB_NAME:-pole_ai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pole_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pole-ai-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pole-ai-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-pole_user}:${DB_PASSWORD:-pole_password}@postgres:5432/${DB_NAME:-pole_ai_db}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: ${DEBUG:-False}
      # LLM (siehe backend/.env.example). Ollama läuft auf dem Host-Rechner.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - pole-ai-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Angular Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: pole-ai-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - pole-ai-network

volumes:
  postgres_data:

networks:
  pole-ai-network:
    driver: bridge
